# Системная Java (26) слишком новая для Gradle 8.10 — он падает с ошибкой вида "26.0.2".
# Поэтому запускаем сам Gradle на JDK 21 (JBR из Android Studio). Так `./gradlew test`
# работает и в терминале, и в IDE без ручного переопределения JAVA_HOME.
# Если у тебя другой путь к JDK 21 — поправь строку ниже (узнать пути: /usr/libexec/java_home -V).
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
